name: CI/CD Deploy to Linux Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |

            if [ ! -d "django-app" ]; then
              git clone https://github.com/${{ github.repository }}.git django-app
              cd django-app
            else
              cd django-app
              git fetch origin main
              git reset --hard origin/main
            fi

            docker stop my_django_app || true
            docker rm my_django_app || true

            # Собираем новый Docker image
            docker build -t django_image:latest .

            docker run -d \
              --name my_django_app \
              --restart always \
              -p 8000:8000 \
              django_image:latest